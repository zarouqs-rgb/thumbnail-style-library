<!DOCTYPE html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jana Video</title>
<style>*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:#0d111b;color:#e8ecf4;padding:14px;max-width:760px;margin:auto}h1{font-size:21px;margin:6px 0}h2{font-size:15px;margin:14px 0 6px;color:#9fb4ff}label{display:block;margin:10px 0 4px;color:#9aa6c4;font-size:13px}input,textarea,select{width:100%;background:#161c2b;border:1px solid #2a3350;color:#e8ecf4;border-radius:10px;padding:10px;font:inherit}textarea{min-height:90px}button{background:#2b6cff;color:#fff;border:0;border-radius:10px;padding:12px 16px;margin:4px 4px 4px 0;font:inherit;font-weight:600}button.alt{background:#262e45}button:disabled{opacity:.5}.big{width:100%;font-size:17px;padding:15px;background:linear-gradient(90deg,#ff3d6e,#ff9a3d)}.row{display:flex;gap:8px}.row>*{flex:1}.m{color:#9aa6c4;font-size:13px}pre,textarea.log{white-space:pre-wrap;background:#121828;border:1px solid #232b45;border-radius:10px;padding:10px;font-size:12.5px;min-height:90px;max-height:260px;overflow:auto}#bar{height:8px;background:#1b2236;border-radius:9px;overflow:hidden;margin:8px 0}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff3d6e,#ff9a3d);transition:width .3s}.sc{display:flex;gap:8px;overflow-x:auto;padding:6px 0}.sc img{height:150px;border-radius:8px;flex:none}video#out{width:60%;max-width:300px;border-radius:12px;background:#000;display:block;margin:8px 0}#ver{font-size:12px;background:#7a2b2b;padding:3px 8px;border-radius:99px;vertical-align:middle}#ver.ok{background:#1f7a3d}.th{display:flex;gap:6px;flex-wrap:wrap}.th img{height:54px;border-radius:6px}</style></head><body>
<h1>Jana Video <span id="ver">⚠ belum lengkap</span></h1>
<p class="m">Tulis tajuk dan bahan, tambah foto kalau nak, tekan Jana. Skrip, gambar dan suara dibuat oleh Gemini, kemudian disambung jadi video menegak 9:16.</p>
<label>Tajuk / topik</label><input id="tj" placeholder="cth: Cara tukar nombor plat di MyJPJ">
<label>Bahan / nota / fakta (pilihan)</label><textarea id="nt" placeholder="Tampal fakta, langkah atau idea di sini"></textarea>
<label style="display:flex;gap:8px;align-items:center;color:#e8ecf4"><input id="rs" type="checkbox" checked style="width:auto"> Research dahulu dengan carian Google (fakta lebih tepat)</label>
<label>Foto sendiri (pilihan, maksimum 2)</label><input id="ft" type="file" accept="image/*" multiple>
<div class="row"><div><label>Gaya visual</label><select id="gy"></select></div><div><label>Bilangan babak</label><select id="bb"><option>4</option><option selected>5</option><option>6</option><option>7</option><option>8</option></select></div></div>
<div class="row"><div><label>Suara</label><select id="sr"></select></div><div><label>Nada</label><select id="nd"><option value="mesra dan ceria">Mesra dan ceria</option><option value="bersemangat seperti pengacara TikTok">Bersemangat</option><option value="tenang dan jelas seperti penerang">Tenang dan jelas</option><option value="dramatik dan misteri">Dramatik</option><option value="santai dan lawak">Santai dan lawak</option></select></div></div>
<label>Kunci API (biarkan kosong dalam Canvas)</label><input id="key" placeholder="kosong = Canvas isi sendiri">
<div style="margin-top:12px"><button class="big" id="go">Jana Video</button><button class="alt big" id="rsm" style="display:none;margin-top:8px">Sambung dari tempat terakhir</button></div>
<div id="bar"><i></i></div>
<pre id="log">Sedia.</pre>
<div id="res" style="display:none">
<h2>Video siap</h2><video id="out" controls playsinline></video>
<div id="dl"></div>
<h2>Babak</h2><div class="sc" id="sc"></div>
<h2>Kapsyen cadangan</h2><textarea id="cap" class="log" readonly onclick="this.select()"></textarea>
<h2>Laporan (tekan lama dan salin kalau butang tak jalan)</h2><textarea id="rep" class="log" readonly onclick="this.select()"></textarea>
<button class="alt" id="cp">Salin laporan</button>
</div>
<script>
const $=s=>document.querySelector(s),API="https://generativelanguage.googleapis.com/v1beta/",L=[];
const STYLES={"Realistik sinematik":"cinematic photorealistic, dramatic lighting, shallow depth of field","Kartun animasi 3D":"3D animated cartoon movie style, vibrant colors, expressive characters","Roblox":"Roblox game style, blocky characters, bright colorful world","Minecraft":"Minecraft voxel blocky style, pixelated textures","Komik viral":"bold comic book illustration, halftone, thick outlines, punchy colors","Storygrid ceria":"flat vector illustration, playful, bright pastel colors, clean shapes","Fantasi menakjubkan":"epic fantasy digital painting, glowing magical light, awe-inspiring","Lawak karikatur":"funny exaggerated caricature cartoon, big expressive faces","Dokumentari sebenar":"documentary photography, natural light, candid realistic"};
const VOICES=["Kore","Puck","Charon","Aoede","Zephyr","Fenrir","Leda","Orus","Callirrhoe","Algenib"];
Object.keys(STYLES).forEach(k=>$("#gy").add(new Option(k,k)));VOICES.forEach(v=>$("#sr").add(new Option(v,v)));
try{$("#key").value=localStorage.getItem("vkey")||""}catch(e){}$("#key").onchange=()=>{try{localStorage.setItem("vkey",$("#key").value.trim())}catch(e){}};
function log(s){L.push(s);const p=$("#log");p.textContent=L.join("\n");p.scrollTop=p.scrollHeight}
function prog(f){$("#bar i").style.width=Math.round(f*100)+"%"}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function post(path,body){const k=$("#key").value.trim();const r=await fetch(API+path+"?key="+k,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});let x={};try{x=await r.json()}catch(e){}if(!r.ok){const m=(x.error&&x.error.message)||("status "+r.status);const e=new Error(m);e.st=r.status;throw e}return x}
async function withModels(models,fn){let last;for(const m of models){for(let t=0;t<2;t++){try{return await fn(m)}catch(e){last=e;if(e.st===429||e.st===503){await sleep(4000*(t+1));continue}break}}}throw last}
function readFile(f){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,768/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.85).split(",")[1])};im.onerror=()=>res(null);im.src=fr.result};fr.onerror=()=>res(null);fr.readAsDataURL(f)})}
async function research(tj,nt){
 const p="Kaji topik ini untuk video pendek bahasa Melayu Malaysia: "+tj+(nt?"\nNota pengguna: "+nt:"")+"\nCari maklumat TERKINI dan TEPAT dari sumber rasmi. Beri 8-12 fakta/langkah penting, ringkas, dalam bahasa Melayu. Sertakan nombor, tarikh, kos atau syarat jika ada. Jangan reka maklumat.";
 const x=await withModels(["gemini-2.5-flash","gemini-flash-latest"],m=>post("models/"+m+":generateContent",{contents:[{role:"user",parts:[{text:p}]}],tools:[{google_search:{}}]}));
 const c=x.candidates[0],t=c.content.parts.map(q=>q.text||"").join("").trim();
 const src=((c.groundingMetadata||{}).groundingChunks||[]).map(g=>g.web&&g.web.title).filter(Boolean).slice(0,6);
 if(!t)throw new Error("research kosong");return{t,src}}
async function writeScript(tj,nt,n,hasPhoto){
 const p="Anda penulis skrip video pendek TikTok/Reels dalam bahasa Melayu Malaysia santai.\nTajuk: "+tj+"\nBahan: "+(nt||"(tiada, guna pengetahuan am yang tepat)")+"\nBuat tepat "+n+" babak. Setiap babak: 'narasi' (1-2 ayat pendek, sebutan mudah, maksimum 22 patah perkataan, tanpa emoji, tanpa simbol) dan 'imej' (arahan imej dalam BAHASA INGGERIS, satu babak visual yang jelas, tiada teks atau tulisan dalam imej"+(hasPhoto?", orang utama ialah orang dalam foto rujukan":"")+"). Babak pertama mesti hook yang menarik perhatian. Babak terakhir ajak tonton/ikut. Juga beri 'kapsyen' (kapsyen Facebook/TikTok pendek dengan 5 hashtag). Balas JSON sahaja: {\"kapsyen\":\"...\",\"babak\":[{\"narasi\":\"...\",\"imej\":\"...\"}]}";
 const x=await withModels(["gemini-2.5-flash","gemini-flash-latest","gemini-2.5-flash-preview-09-2025"],m=>post("models/"+m+":generateContent",{contents:[{role:"user",parts:[{text:p}]}],generationConfig:{responseMimeType:"application/json",temperature:.9}}));
 const t=x.candidates[0].content.parts.map(q=>q.text||"").join("").replace(/^```json|```$/g,"").trim();const j=JSON.parse(t);if(!j.babak||!j.babak.length)throw new Error("skrip kosong");return j}
async function makeImage(prompt,style,photos){
 const parts=[];photos.forEach(b=>parts.push({inlineData:{mimeType:"image/jpeg",data:b}}));
 parts.push({text:(photos.length?"Use the person in the reference photo(s) as the main character, keep their face and likeness. ":"")+"Vertical 9:16 video frame. "+prompt+". Style: "+style+". Absolutely no text, letters, captions or watermarks in the image."});
 const x=await withModels(["gemini-3.1-flash-image","gemini-2.5-flash-image"],m=>post("models/"+m+":generateContent",{contents:[{role:"user",parts}],generationConfig:{responseModalities:["TEXT","IMAGE"],imageConfig:{aspectRatio:"9:16"}}}));
 const pt=((x.candidates||[])[0]||{content:{parts:[]}}).content.parts.find(q=>q.inlineData);if(!pt)throw new Error("tiada gambar dalam jawapan");return "data:"+pt.inlineData.mimeType+";base64,"+pt.inlineData.data}
async function makeVoice(text,voice,tone){
 const x=await withModels(["gemini-2.5-flash-preview-tts"],m=>post("models/"+m+":generateContent",{contents:[{role:"user",parts:[{text:"Bacakan dalam bahasa Melayu Malaysia dengan nada "+tone+", sebutan jelas dan lancar: "+text}]}],generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voice}}}}}));
 const pt=x.candidates[0].content.parts.find(q=>q.inlineData);if(!pt)throw new Error("tiada audio");return pt.inlineData.data}
function toBuf(b64,ctx){const bin=atob(b64),n=bin.length>>1,buf=ctx.createBuffer(1,n,24000),ch=buf.getChannelData(0);
 for(let i=0;i<n;i++){let v=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8);if(v>32767)v-=65536;ch[i]=v/32768}return buf}
// simpanan: IndexedDB (kalau dibenarkan), supaya boleh sambung selepas refresh
let DBP=null;function db(){if(!DBP)DBP=new Promise((res,rej)=>{try{const q=indexedDB.open("jvid",1);q.onupgradeneeded=()=>q.result.createObjectStore("k");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}});return DBP}
async function kvSet(k,v){try{const d=await db();return await new Promise((r,j)=>{const t=d.transaction("k","readwrite");t.objectStore("k").put(v,k);t.oncomplete=()=>r(true);t.onerror=()=>j(t.error)})}catch(e){return false}}
async function kvGet(k){try{const d=await db();return await new Promise((r,j)=>{const q=d.transaction("k").objectStore("k").get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}catch(e){return undefined}}
async function kvDel(k){try{const d=await db();d.transaction("k","readwrite").objectStore("k").delete(k)}catch(e){}}
let ST=null;
const FIELDS=["tj","nt","gy","bb","sr","nd"];
function form(){const f={};FIELDS.forEach(k=>f[k]=$("#"+k).value);f.rs=$("#rs").checked;return f}
function saveForm(){kvSet("form",form())}
async function saveST(){if(ST)return kvSet("st",ST)}
function loadImg(src){return new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);setTimeout(()=>res(null),8000);im.src=src})}
function wrap(c,t,w){const ws=t.split(/\s+/),ls=[];let l="";ws.forEach(x=>{const q=l?l+" "+x:x;if(c.measureText(q).width>w&&l){ls.push(l);l=x}else l=q});if(l)ls.push(l);return ls}
function chunks(t){const ws=t.split(/\s+/),o=[];for(let i=0;i<ws.length;i+=4)o.push(ws.slice(i,i+4).join(" "));return o}
async function assemble(sc,ctx){
 const W=720,H=1280,cv=document.createElement("canvas");cv.width=W;cv.height=H;const g=cv.getContext("2d");
 const ims=[];for(const s of sc)ims.push(s.img?await loadImg(s.img):null);
 const dest=ctx.createMediaStreamDestination(),times=[];let T=0.4;sc.forEach(s=>{times.push(T);T+=s.buf.duration+0.35});const total=T+0.3;
 const mimes=["video/mp4;codecs=avc1,mp4a.40.2","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"];
 const mt=mimes.find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||"";
 const st=cv.captureStream(30);dest.stream.getAudioTracks().forEach(t=>st.addTrack(t));
 const rec=new MediaRecorder(st,mt?{mimeType:mt,videoBitsPerSecond:4000000}:undefined),parts=[];
 rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};const done=new Promise(r=>rec.onstop=r);
 const t0=ctx.currentTime+0.2;rec.start(500);
 sc.forEach((s,i)=>{const src=ctx.createBufferSource();src.buffer=s.buf;src.connect(dest);src.start(t0+times[i])});
 await new Promise(res=>{function frame(){const t=ctx.currentTime-t0;if(t>=total){res();return}
  let i=0;times.forEach((x,k)=>{if(t>=x)i=k});const s=sc[i],im=ims[i],dur=s.buf.duration+0.35,p=Math.min(1,Math.max(0,(t-times[i])/dur));
  g.fillStyle="#000";g.fillRect(0,0,W,H);
  if(im){const z=1.04+0.10*(i%2?1-p:p),sw=im.width,sh=im.height,sc2=Math.max(W/sw,H/sh)*z,dw=sw*sc2,dh=sh*sc2,ox=(i%3-1)*30*p;g.drawImage(im,(W-dw)/2+ox,(H-dh)/2,dw,dh)}
  else{const gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,"#2b3a8f");gr.addColorStop(1,"#a8286b");g.fillStyle=gr;g.fillRect(0,0,W,H)}
  const gb=g.createLinearGradient(0,H*.55,0,H);gb.addColorStop(0,"rgba(0,0,0,0)");gb.addColorStop(1,"rgba(0,0,0,.65)");g.fillStyle=gb;g.fillRect(0,H*.55,W,H*.45);
  const cs=chunks(s.narasi),k=Math.min(cs.length-1,Math.floor(Math.min(1,Math.max(0,(t-times[i])/s.buf.duration))*cs.length));
  g.font="800 54px system-ui,Arial,sans-serif";g.textAlign="center";g.lineJoin="round";g.lineWidth=10;g.strokeStyle="#000";g.fillStyle="#ffe14a";
  const ls=wrap(g,cs[k].toUpperCase(),W-90);ls.forEach((l,j)=>{const y=H-250+j*62-(ls.length-1)*31;g.strokeText(l,W/2,y);g.fillText(l,W/2,y)});
  prog(.55+.45*Math.min(1,t/total));requestAnimationFrame(frame)}frame()});
 rec.stop();await done;ctx.close&&ctx.close();
 return{blob:new Blob(parts,{type:(rec.mimeType||mt||"video/webm").split(";")[0]}),mime:rec.mimeType||mt}}
function showResult(blob,sc,cap,srcs,mime){
 const url=URL.createObjectURL(blob),ext=/mp4/.test(blob.type)?"mp4":"webm";
 $("#out").src=url;$("#dl").innerHTML='<a href="'+url+'" download="video.'+ext+'"><button>Muat turun video ('+ext+', '+(blob.size/1048576).toFixed(1)+' MB)</button></a>';
 $("#sc").innerHTML="";sc.forEach(s=>{if(s.img){const i=new Image();i.src=s.img;$("#sc").appendChild(i)}});
 $("#cap").value=cap||"";
 $("#rep").value=["Video siap","Format: "+(mime||blob.type),"Saiz: "+(blob.size/1048576).toFixed(2)+" MB","Babak: "+sc.length,"Sumber research: "+((srcs||[]).join("; ")||"tiada"),"Gambar gagal: "+sc.filter(s=>!s.img).length].join("\n");
 $("#res").style.display="block"}
async function run(resume){
 L.length=0;$("#go").disabled=true;$("#rsm").style.display="none";$("#res").style.display="none";prog(0);
 if(!resume||!ST){const tj=$("#tj").value.trim();if(!tj){log("Isi tajuk dahulu.");$("#go").disabled=false;return}
  ST={f:form(),photos:[],sj:null,sc:null,srcs:[],cap:"",nota:null};
  for(const f of [].slice.call($("#ft").files,0,2)){const b=await readFile(f);if(b)ST.photos.push(b)}
  await kvDel("video");await saveST()}else{log("Menyambung daripada tempat terakhir…");
  FIELDS.forEach(k=>$("#"+k).value=ST.f[k]);$("#rs").checked=ST.f.rs}
 const AC=window.AudioContext||window.webkitAudioContext,ctx=new AC();try{await ctx.resume()}catch(e){}
 try{
  const f=ST.f,tj=f.tj,n=+f.bb,style=STYLES[f.gy];
  if(!ST.sj){
   let nota=f.nt.trim(),srcs=[];
   if(f.rs){log("0/3 Research dengan carian Google…");try{const r=await research(tj,nota);nota=(nota?nota+"\n\n":"")+"HASIL RESEARCH (guna ini sebagai fakta):\n"+r.t;srcs=r.src;log("   research siap"+(srcs.length?" ("+srcs.length+" sumber)":""))}catch(e){log("   research gagal, guna pengetahuan am: "+e.message.slice(0,100))}}
   log("1/3 Menulis skrip…");const sj=await writeScript(tj,nota,n,ST.photos.length>0);
   ST.sj=sj;ST.srcs=srcs;ST.cap=sj.kapsyen||"";ST.sc=sj.babak.map(b=>({narasi:String(b.narasi||"").replace(/[*_#]/g,"").trim(),imej:b.imej||tj,img:undefined,pcm:null}));await saveST();log("   skrip siap: "+ST.sc.length+" babak")}
  else log("1/3 Skrip sudah ada ("+ST.sc.length+" babak)");
  prog(.1);const sc=ST.sc;
  for(let i=0;i<sc.length;i++){
   if(sc[i].img===undefined){log("2/3 Babak "+(i+1)+"/"+sc.length+": gambar…");
    try{sc[i].img=await makeImage(sc[i].imej,style,ST.photos)}catch(e){sc[i].img=null;log("   gambar gagal: "+e.message.slice(0,100))}await saveST()}
   if(!sc[i].pcm){log("2/3 Babak "+(i+1)+"/"+sc.length+": suara…");sc[i].pcm=await makeVoice(sc[i].narasi,f.sr,f.nd);await saveST()}
   prog(.1+.45*(i+1)/sc.length)}
  const run2=sc.map(s=>({narasi:s.narasi,img:s.img,buf:toBuf(s.pcm,ctx)}));
  log("3/3 Menyambung video (akan main sendiri, jangan tutup tab)…");
  const out=await assemble(run2,ctx);
  await kvSet("video",out.blob);ST.done=true;ST.mime=out.mime;await saveST();
  showResult(out.blob,sc,ST.cap,ST.srcs,out.mime);prog(1);log("Siap. Muat turun video atau hantar kepada Claude.");
 }catch(e){log("RALAT: "+(e.message||e)+"\n(kemajuan disimpan, tekan Sambung untuk cuba lagi)");$("#rep").value=L.join("\n");$("#res").style.display="block";try{ctx.close()}catch(_){}if(ST&&ST.sj)$("#rsm").style.display="inline-block"}
 $("#go").disabled=false}
$("#go").onclick=()=>run(false);$("#rsm").onclick=()=>run(true);
FIELDS.concat(["rs"]).forEach(k=>$("#"+k).addEventListener("change",saveForm));$("#tj").addEventListener("input",saveForm);$("#nt").addEventListener("input",saveForm);
(async()=>{const fm=await kvGet("form");if(fm){FIELDS.forEach(k=>{if(fm[k]!=null)$("#"+k).value=fm[k]});if(fm.rs!=null)$("#rs").checked=fm.rs}
 const st=await kvGet("st");if(st&&st.sj){ST=st;if(st.done){const v=await kvGet("video");if(v){showResult(v,st.sc,st.cap,st.srcs,st.mime);log("Video terakhir dipulihkan.")}}else{$("#rsm").style.display="inline-block";log("Ada kerja belum siap ("+st.sc.filter(x=>x.pcm).length+"/"+st.sc.length+" babak). Tekan Sambung.")}}})();
$("#cp").onclick=()=>{const t=$("#rep");t.select();try{document.execCommand("copy")}catch(e){}};
window.__VID_END=1;$("#ver").textContent="✓ v1.2 lengkap";$("#ver").className="ok";
</script></body></html>
