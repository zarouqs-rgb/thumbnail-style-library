<!DOCTYPE html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ujian Gemini</title>
<style>*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:#0d111b;color:#e8ecf4;padding:14px;max-width:720px;margin:auto}h1{font-size:20px;margin:6px 0}button{background:#2b6cff;color:#fff;border:0;border-radius:10px;padding:11px 14px;margin:4px 4px 4px 0;font:inherit}button.alt{background:#262e45}button:disabled{opacity:.5}input,textarea{width:100%;background:#161c2b;border:1px solid #2a3350;color:#e8ecf4;border-radius:10px;padding:10px;font:inherit}pre{white-space:pre-wrap;background:#121828;border:1px solid #232b45;border-radius:10px;padding:10px;font-size:12.5px;min-height:120px}.m{color:#9aa6c4}</style></head><body>
<h1>Ujian Gemini dalam Canvas <span id="ver" style="font-size:12px;background:#7a2b2b;padding:3px 8px;border-radius:99px">ujian v1</span></h1>
<p class="m">Tekan setiap ujian. Selepas siap, tekan Salin laporan dan hantar kepada Claude.</p>
<input id="key" placeholder="Kunci API (biarkan kosong dalam Canvas)">
<div style="margin:8px 0"><button id="t1">1. Teks</button><button id="t2">2. Gambar</button><button id="t3">3. Suara</button><button id="t4">4. Video</button><button class="alt" id="all">Semua (1-3)</button></div>
<audio id="au" controls style="width:100%;display:none"></audio><img id="im" style="width:50%;display:none;border-radius:10px"><video id="vd" controls style="width:50%;display:none"></video>
<pre id="log">Belum ada ujian.</pre><button class="alt" id="cp">Salin laporan</button>
<script>
const $=s=>document.querySelector(s),L=[];
function log(s){L.push(s);$("#log").textContent=L.join("\n")}
const K=()=>$("#key").value.trim();
const API="https://generativelanguage.googleapis.com/v1beta/";
async function post(path,body){const r=await fetch(API+path+(path.includes("?")?"&":"?")+"key="+K(),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});let x;try{x=await r.json()}catch(e){x={}}return{ok:r.ok,st:r.status,x}}
const em=x=>((x.x&&x.x.error&&x.x.error.message)||("status "+x.st)).slice(0,160);
async function tryModels(label,models,fn){log("== "+label);let any=false;for(const m of models){try{const r=await fn(m);if(r.ok){log("  OK  "+m+(r.note?" ("+r.note+")":""));any=true;break}else log("  GAGAL "+m+": "+em(r))}catch(e){log("  RALAT "+m+": "+e.message)}}if(!any)log("  => "+label+": tiada model berjaya");return any}
async function tText(){return tryModels("Teks",["gemini-2.5-flash","gemini-flash-latest","gemini-2.5-flash-preview-09-2025"],async m=>{const r=await post("models/"+m+":generateContent",{contents:[{role:"user",parts:[{text:"Tulis satu ayat pendek bahasa Melayu tentang hari yang cerah."}]}]});if(r.ok){const t=(r.x.candidates[0].content.parts||[]).map(p=>p.text||"").join("");r.note=t.slice(0,60)}return r})}
async function tImage(){return tryModels("Gambar",["gemini-3.1-flash-image","gemini-2.5-flash-image"],async m=>{const r=await post("models/"+m+":generateContent",{contents:[{role:"user",parts:[{text:"A small red apple on a white table, simple illustration."}]}],generationConfig:{responseModalities:["TEXT","IMAGE"]}});if(r.ok){const p=((r.x.candidates||[])[0]||{content:{parts:[]}}).content.parts.find(p=>p.inlineData);if(p){$("#im").src="data:"+p.inlineData.mimeType+";base64,"+p.inlineData.data;$("#im").style.display="block"}else{r.ok=false;r.x={error:{message:"tiada gambar dalam jawapan"}}}}return r})}
function wav(b64){const pcm=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)),n=pcm.length,h=new DataView(new ArrayBuffer(44));const w=(o,s)=>{for(let i=0;i<s.length;i++)h.setUint8(o+i,s.charCodeAt(i))};w(0,"RIFF");h.setUint32(4,36+n,true);w(8,"WAVE");w(12,"fmt ");h.setUint32(16,16,true);h.setUint16(20,1,true);h.setUint16(22,1,true);h.setUint32(24,24000,true);h.setUint32(28,48000,true);h.setUint16(32,2,true);h.setUint16(34,16,true);w(36,"data");h.setUint32(40,n,true);return new Blob([h.buffer,pcm],{type:"audio/wav"})}
async function tVoice(){return tryModels("Suara (TTS)",["gemini-2.5-flash-preview-tts","gemini-2.5-pro-preview-tts","gemini-3.1-flash-tts-preview"],async m=>{const r=await post("models/"+m+":generateContent",{contents:[{parts:[{text:"Cakap dengan nada ceria dan jelas: Selamat pagi, hari ini kita belajar cara tukar nombor telefon dalam MyJPJ."}]}],generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:"Kore"}}}}});if(r.ok){const p=((r.x.candidates||[])[0]||{content:{parts:[]}}).content.parts.find(p=>p.inlineData);if(p){$("#au").src=URL.createObjectURL(wav(p.inlineData.data));$("#au").style.display="block";r.note="audio diterima, tekan main"}else{r.ok=false;r.x={error:{message:"tiada audio dalam jawapan"}}}}return r})}
async function tVideo(){return tryModels("Video",["veo-3.1-fast-generate-preview","veo-3.0-fast-generate-001","veo-3.0-generate-001","veo-2.0-generate-001"],async m=>{const r=await post("models/"+m+":predictLongRunning",{instances:[{prompt:"A red apple rolling slowly on a wooden table, soft daylight."}]});if(r.ok)r.note="permintaan diterima (tidak ditunggu hingga siap, kuota mungkin terpakai)";return r})}
async function run(f,b){b.disabled=true;try{await f()}catch(e){log("RALAT: "+e.message)}b.disabled=false}
$("#t1").onclick=e=>run(tText,e.target);$("#t2").onclick=e=>run(tImage,e.target);$("#t3").onclick=e=>run(tVoice,e.target);$("#t4").onclick=e=>run(tVideo,e.target);
$("#all").onclick=async e=>{e.target.disabled=true;await tText();await tImage();await tVoice();e.target.disabled=false;log("== siap (video diuji berasingan)")};
$("#cp").onclick=()=>{const t=L.join("\n");try{navigator.clipboard.writeText(t);$("#cp").textContent="Disalin"}catch(e){$("#cp").textContent="Pilih teks dan salin manual"}};
window.__TH_END=1;(function(){var v=$("#ver");v.textContent="ujian v1 ✓ lengkap";v.style.background="#1f6b3a"})();
</script></body></html>
