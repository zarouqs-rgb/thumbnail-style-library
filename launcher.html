<!DOCTYPE html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apps Jebat Saputra</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d111b;color:#e8ecf4;font:16px/1.4 system-ui,sans-serif;padding:22px;max-width:560px;margin:auto}h1{font-size:22px;margin:10px 0 4px}p{color:#9aa6c4;margin:0 0 18px}.c{display:block;width:100%;text-align:left;border:0;border-radius:16px;padding:20px;margin:12px 0;color:#fff;font:inherit;cursor:pointer}.c b{font-size:20px;display:block}.c span{font-size:13px;opacity:.9}.a{background:linear-gradient(135deg,#ff3d6e,#ff9a3d)}.b{background:linear-gradient(135deg,#2b6cff,#7a4dff)}.s{background:linear-gradient(135deg,#1f7a3d,#2fb36a)}#st{color:#9aa6c4;font-size:13px;margin-top:14px;min-height:20px}</style></head><body>
<h1>Apps Jebat Saputra</h1><p>Pilih app untuk dibuka.</p>
<button class="c a" data-u="video.html"><b>🎬 Jana Video</b><span>Skrip, gambar, suara, komik dan sketsa jadi video</span></button>
<button class="c s" data-u="video-stable.html"><b>🛟 Jana Video (versi stabil)</b><span>Versi v1.8 yang sudah diuji, guna kalau versi terbaru bermasalah</span></button>
<button class="c b" data-u="app.html"><b>🖼️ TH Library</b><span>Pustaka gaya thumbnail dan poster</span></button>
<div id="st"></div>
<script>
(function(){var B=["https://raw.githubusercontent.com/zarouqs-rgb/thumbnail-style-library/main/","https://cdn.jsdelivr.net/gh/zarouqs-rgb/thumbnail-style-library@main/"],st=document.getElementById("st");
function inject(t){var d=new DOMParser().parseFromString(t,"text/html"),b=document.body,S=[].slice.call(d.querySelectorAll("script"));
S.forEach(function(s){s.parentNode.removeChild(s)});
[].slice.call(d.head.querySelectorAll("style")).forEach(function(s){document.head.appendChild(document.importNode(s,true))});
b.removeAttribute("style");b.innerHTML=d.body.innerHTML;
var m=document.createElement("button");m.textContent="☰ Menu";m.style.cssText="position:fixed;top:8px;right:8px;z-index:99999;background:#000a;color:#fff;border:1px solid #fff4;border-radius:99px;padding:6px 12px;font:13px system-ui";m.onclick=function(){location.reload()};b.appendChild(m);
S.forEach(function(s){var n=document.createElement("script");n.textContent=s.textContent;b.appendChild(n)})}
function load(u,i){if(i>=B.length){st.textContent="Gagal memuat. Semak sambungan dan cuba lagi.";return}
fetch(B[i]+u+"?t="+Date.now()).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){if(t.indexOf("</html>")<0)throw 0;return t}).then(inject,function(){load(u,i+1)})}
[].forEach.call(document.querySelectorAll(".c"),function(b){b.onclick=function(){st.textContent="Memuat…";load(b.getAttribute("data-u"),0)}})})();
</script></body></html>
